[theme]
base = "dark"
primaryColor = "#FF6B35"
backgroundColor = "#080B14"
secondaryBackgroundColor = "#121A2D"
textColor = "#FFFFFF"
font = "sans serif"

[server]
headless = true
maxUploadSize = 500
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = true

[browser]
gatherUsageStats = false
